<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="page-title">Try SPARQL against a real ontology graph - ont_mm</title>
<script src="https://cdn.jsdelivr.net/npm/rdflib@2.2.35/dist/rdflib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 2em auto; padding: 0 1em; line-height: 1.5; }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
  button { font-size: 15px; padding: 0.5em 1.2em; margin: 0.5em 0; cursor: pointer; }
  button:disabled { cursor: wait; opacity: 0.6; }
  #status { margin: 0.5em 0; font-weight: bold; }
  #error { color: #b00020; white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #fff0f0; padding: 0.8em; border-radius: 4px; display: none; }
  table { border-collapse: collapse; width: 100%; margin-top: 1em; }
  th, td { border: 1px solid #ccc; padding: 0.4em 0.6em; text-align: left; font-size: 14px; word-break: break-all; }
  th { background: #f5f5f5; }
  .example-btn { font-size: 13px; margin: 0.2em 0.4em 0.2em 0; padding: 0.4em 0.8em; display: inline-block; }
  .example-desc { font-size: 12px; color: #666; margin: 0 0 0.8em 0; }
</style>
</head>
<body>

<h1 id="page-heading">Try SPARQL against a real ontology graph</h1>

<p>
  <label for="dataset-select"><strong>Dataset:</strong></label>
  <select id="dataset-select" onchange="switchDataset(this.value)"></select>
</p>
<p id="own-graph-file-row" style="display:none;">
  <label for="own-graph-file"><strong>Turtle file:</strong></label>
  <input type="file" id="own-graph-file" accept=".ttl,.n3,.rdf,.owl" onchange="loadUserFile(this.files[0])">
</p>
<p id="page-intro"></p>

<p id="status">Loading graph...</p>
<div id="error"></div>

<div id="query-area" style="display:none;">

<p><strong>Try one of these first:</strong></p>
<div id="example-buttons"></div>

<p>Or write your own SPARQL query below (the prefixes configured for
this graph are already declared for you, and don't need to be
repeated in the box):</p>

<textarea id="query-box"></textarea>
<br>
<button id="run-btn" onclick="runQuery()">Run query</button>

<div id="label-style-toggle" style="display:none; margin-top: 0.5em; font-size: 14px;">
  <label>
    <input type="checkbox" id="short-labels-toggle" checked onchange="toggleLabelStyle()">
    Show short labels (uncheck for full URIs)
  </label>
</div>
<div id="view-toggle" style="display:none; margin-top: 0.5em;">
  <button onclick="showView('table')" id="table-view-btn">Table view</button>
  <button onclick="showView('graph')" id="graph-view-btn">Graph view</button>
</div>
<div id="results"></div>
<div id="graph-container" style="display:none; height: 500px; border: 1px solid #ccc; margin-top: 1em;"></div>

</div>

<script>
// =====================================================================
// CONFIG - everything specific to one graph lives here. To reuse this
// page for a different graph, copy this whole file and edit only this
// block; nothing below this point should need to change.
// =====================================================================
// DATASETS - every graph this page can query. To add another one
// later, add a new entry here with its own id; nothing else needs
// to change - the dropdown, the graph loading, and the file-link
// pattern all read from this automatically.
const DATASETS = {

    datasetExamples: [

        query: `SELECT ?output ?type WHERE {

    pageTitle: "caa (reasoned) dataset - SPARQL playground - ont_mm",
    introHtml: 'It loads <a href="https://github.com/Darren01/ont_mm/blob/main/examples/caa/ont/caa_graph_reasoned.ttl">' +

    graphUrl: "https://raw.githubusercontent.com/Darren01/ont_mm/main/examples/caa/ont/caa_graph_reasoned.ttl",
    outputsPath: "examples/caa/outputs/",
    datasetExamples: [
      {
        label: "Imaginary frequencies (reasoned)",
        description: "The same real question as the shared \"Imaginary frequencies\" example above - but here, a reasoner has already worked out which peaks are imaginary and written it directly into the graph as a real type, so the query no longer needs FILTER(?freq < 0) or its xsd:decimal/xsd:float gotcha at all. Compare the two queries side by side on this same dataset - same real answer, genuinely simpler to ask.",
        query: `SELECT ?peak WHERE {

}`

        label: "Provenance: trace a file",
        description: "Swap the input file URI for any other experiment's own to trace where its outputs came from. \"Generated by\" is broader than just this run's own log/data files - it also captures a later experiment's input file when that geometry was itself built from this one's result, which is why ?type is shown alongside each one.",
        query: `SELECT ?output ?type WHERE {
  ?exp prov:used ex:file_caa001a_inp .
  ?output prov:wasGeneratedBy ?exp .
  ?output a ?type .
  FILTER(?type != owl:NamedIndividual)
}`
      }
    ]
  },
  aa_reasoned: {
    label: "aa (reasoned) - acetaldehyde",
    pageTitle: "aa (reasoned) dataset - SPARQL playground - ont_mm",
    introHtml: 'It loads <a href="https://github.com/Darren01/ont_mm/blob/main/examples/aa/ont/aa_graph_reasoned.ttl">' +
      '<code>aa_graph_reasoned.ttl</code></a> - the same real aa project as the plain ' +
      '<code>aa</code> dataset, but with a real OWL DL reasoner (HermiT) actually run over it, ' +
      'materializing genuine inferences (see ' +
      '<a href="https://github.com/Darren01/ont_mm/blob/main/dl_axioms.ttl">dl_axioms.ttl</a>) ' +
      'rather than only ever containing asserted facts. Everything the plain <code>aa</code> ' +
      'dataset can answer, this can too - plus the new example below, only possible here.',
    graphUrl: "https://raw.githubusercontent.com/Darren01/ont_mm/main/examples/aa/ont/aa_graph_reasoned.ttl",
    outputsPath: "examples/aa/outputs/",
    datasetExamples: [
      {
        label: "Imaginary frequencies (reasoned)",
        description: "The same real question as the shared \"Imaginary frequencies\" example above - but here, a reasoner has already worked out which peaks are imaginary and written it directly into the graph as a real type, so the query no longer needs FILTER(?freq < 0) or its xsd:decimal/xsd:float gotcha at all. Compare the two queries side by side on this same dataset - same real answer, genuinely simpler to ask.",
        query: `SELECT ?peak WHERE {
  ?peak a ex:ImaginaryFrequencyPeak .
}`
      },
      {
        label: "Provenance: trace a file",
        description: "Swap the input file URI for any other experiment's own to trace where its outputs came from. \"Generated by\" is broader than just this run's own log/data files - it also captures a later experiment's input file when that geometry was itself built from this one's result, which is why ?type is shown alongside each one.",
        query: `SELECT ?output ?type WHERE {
  ?exp prov:used ex:file_aa001a_inp .
  ?output prov:wasGeneratedBy ?exp .
  ?output a ?type .
  FILTER(?type != owl:NamedIndividual)
}`
      }
    ]
  },
  own_graph: {
    label: "My own graph (upload a file)...",
    pageTitle: "My own graph - SPARQL playground - ont_mm",
    introHtml: "Choose a Turtle (.ttl) file below to load your own graph - " +
      "nothing is uploaded anywhere, the file is read directly in your own " +
      "browser. None of the ont_mm-specific example queries apply here, " +
      "since they use this project's own vocabulary - the two queries below " +
      "work on any RDF graph, and are a genuine, general-purpose way to get " +
      "your bearings in an unfamiliar one: the first gives a rough map of " +
      "what kinds of things it holds, the second shows every predicate it " +
      "actually uses, so you can go looking for your own graph's own " +
      "equivalent of a term you've seen used here.",
    isUserUpload: true,
    prefixesOverride: `
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX owl: <http://www.w3.org/2002/07/owl#>
`,
    datasetExamples: [
      {
        label: "What kinds of things exist?",
        description: "Genuinely generic - works on any RDF graph, not just this project's own. Counts how many individuals exist of each real type actually used, most common first - the fastest way to get a rough map of an unfamiliar graph's own subject matter.",
        query: `SELECT ?type (COUNT(?s) AS ?count) WHERE {
  ?s a ?type .
}
GROUP BY ?type
ORDER BY DESC(?count)`
      },
      {
        label: "What properties are actually used?",
        description: "Also genuinely generic. Lists every real predicate used anywhere in the loaded graph - directly useful for finding your own graph's own equivalent of a property you've seen in one of this project's own examples (its own version of something like ex:hasConstraint or gc:hasFrequency, under whatever name it actually uses).",
        query: `SELECT DISTINCT ?property WHERE {
  ?s ?property ?o .
}
ORDER BY ?property`
      }
    ]
  }
};

// caa stays the default - the existing, already-shared GitHub Pages
// link has no ?dataset= parameter, and should keep behaving exactly
// as it always has.
const DEFAULT_DATASET_ID = "caa";

let currentDatasetId = DEFAULT_DATASET_ID;

// Everything below is genuinely generic across every dataset above -
// the same ontology schema, so the same prefixes and the same three
// example queries work unchanged regardless of which graph is loaded.
const SHARED = {
  heading: "Try SPARQL against a real ontology graph",

  prefixes: `
PREFIX gc: <http://purl.org/gc/>
PREFIX ex: <http://example.org/>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX prov: <http://www.w3.org/ns/prov#>
PREFIX owl: <http://www.w3.org/2002/07/owl#>
`,

  // Each example needs a short label (for its button), a one-line
  // description (shown under the button row once picked), and the
  // query body itself (SHARED.prefixes is prepended automatically -
  // don't repeat PREFIX lines here).
  examples: [
    {
      label: "Experiments by type",
      description: "The basic inventory - every experiment, grouped by what kind of calculation it was.",
      query: `SELECT ?exp ?type WHERE {
  ?exp a ?type .
  FILTER(?type IN (gc:GeometryOptimization, gc:SinglePoint,
                    gc:VibrationalAnalysis, gc:SaddlePoint, gc:IRC))
}`
    },
    {
      label: "Your own review notes",
      description: "Every experiment with a recorded annotation - the real, contemporaneous debugging trail.",
      query: `SELECT ?exp ?comment WHERE {
  ?exp a gc:MolecularComputation .
  ?exp skos:editorialNote ?comment .
}`
    },
    {
      label: "Imaginary frequencies",
      description: "A data-quality check - flags any result whose geometry may not be a genuine minimum (or, for a transition state, the expected single saddle point).",
      query: `SELECT ?spectrum ?freq WHERE {
  ?spectrum gc:hasFrequencyPeak ?peak .
  ?peak gc:hasFrequency ?fv .
  ?fv gc:hasFloatValue ?freq .
  FILTER(?freq < 0)
}`
    },
    {
      label: "Find the exact geometry",
      description: "Which experiment used a specific, known constraint value - a real, queryable signature for one particular structure, joined back to the experiment that used it.",
      query: `SELECT ?exp ?constraint WHERE {
  ?exp ex:hasConstraint ?constraint .
  ?constraint ex:targetValue ?target .
  FILTER(?target = 1.2)
}`
    },
    {
      label: "Real energetics",
      description: "The actual thermodynamic numbers behind a result - not just structural metadata, genuine computed quantities.",
      query: `SELECT ?exp ?zpeVal ?enthalpyVal ?entropyVal ?gibbsVal ?electronicVal WHERE {
  ?exp gc:hasResult ?energies .
  OPTIONAL { ?energies gc:hasZeroPointEnergy ?zpe . ?zpe gc:hasFloatValue ?zpeVal . }
  OPTIONAL { ?energies gc:hasEnthalpy ?enthalpy . ?enthalpy gc:hasFloatValue ?enthalpyVal . }
  OPTIONAL { ?energies gc:hasEntropy ?entropy . ?entropy gc:hasFloatValue ?entropyVal . }
  OPTIONAL { ?energies gc:hasGibbsFreeEnergy ?gibbs . ?gibbs gc:hasFloatValue ?gibbsVal . }
  OPTIONAL { ?energies gc:hasElectronicEnergy ?elec . ?elec gc:hasFloatValue ?electronicVal . }
}`
    },
    {
      label: "Linked to a published paper",
      description: "Which experiment is linked to a specific DOI - a real literature cross-reference, not just internal notes. An honest \"no results\" here is itself a real finding for a dataset with no link recorded yet, not an error.",
      query: `SELECT ?exp WHERE {
  ?exp dcterms:relation <https://doi.org/10.1021/ja00249a034> .
}`
    }
  ],

  // Turn a cell value into a real, clickable link when it matches a
  // known pattern - scoped deliberately narrow, to mappings this
  // project's naming convention makes genuinely reliable. urlFor
  // reads the CURRENTLY SELECTED dataset's own outputsPath, so the
  // same pattern correctly targets whichever graph is actually loaded.
  linkPatterns: [
    {
      // ex:exp_aa001a / ex:exp_caa001a -> the real .log file on
      // GitHub, which GitHub already renders as readable plain text.
      regex: /example\.org\/exp_([A-Za-z0-9\-]+)$/,
      urlFor: function (match) {
        const outputsPath = DATASETS[currentDatasetId].outputsPath;
        // No known outputsPath (the own-graph case, which also has no
        // real reason to share this project's own example.org
        // namespace in the first place) - skip the link rather than
        // build one pointing at a file that was never actually there.
        if (!outputsPath) return null;
        return "https://raw.githubusercontent.com/Darren01/ont_mm/main/" + outputsPath + match[1] + ".log";
      }
    }
  ]
};
// ===================== end of config - engine code below =====================

let store = null;
let lastRows = [];
let lastVarNames = [];
let lastTotalMatches = 0;
let lastWasLimited = false;
let useShortLabels = true;

// Builds a {prefix: full_uri} map from SHARED.prefixes, once, for
// expanding a prefixed name (e.g. "gc:SinglePoint") to the full URI
// that actually appears in query results - needed because the manual
// FILTER workaround below compares against rdflib.js's raw, fully-
// expanded result values, not the prefixed forms written in a query.
const PREFIX_MAP = (function () {
  const map = {};
  const re = /PREFIX\s+(\w+):\s*<([^>]+)>/gi;
  let m;
  while ((m = re.exec(SHARED.prefixes)) !== null) {
    map[m[1]] = m[2];
  }
  return map;
})();

function expandPrefixed(value) {
  const m = value.match(/^(\w+):([\w-]+)$/);
  if (m && PREFIX_MAP[m[1]]) {
    return PREFIX_MAP[m[1]] + m[2];
  }
  return value;
}

function shortLabel(value) {
  if (typeof value !== "string") return String(value);

  // A number (e.g. a raw energy value like -766.3719959497) gets
  // rounded for display, not just a URI shortened - the full,
  // unrounded value is still always available via the hover tooltip.
  if (/^-?\d+\.\d+$/.test(value)) {
    const num = parseFloat(value);
    return num.toFixed(4).replace(/\.?0+$/, "") || "0";
  }

  const match = value.match(/[\/#]([^\/#]+)$/);
  return match ? match[1] : value;
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value;
  return div.innerHTML;
}

// Renders a table cell's value as a real link when it matches one of
// SHARED.linkPatterns, otherwise as plain, safely-escaped text. Either
// way, the visible text honours the current short/full label setting;
// the full, real value is always kept as a hover tooltip, and a
// link's actual target is always the real, full URL regardless of
// which label style is showing.
// Downloads a URL's real content as a local file, via fetch()+Blob -
// more reliable than a plain <a download> attribute, which many
// browsers silently ignore for cross-origin links (like GitHub's raw
// content) and just navigate to instead of actually downloading.
async function downloadFile(url, filename) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  } catch (err) {
    alert("Could not download the file: " + err.message);
  }
}

function linkifyValue(value) {
  const strValue = String(value);
  const displayText = useShortLabels ? shortLabel(strValue) : strValue;

  for (const pattern of SHARED.linkPatterns) {
    const match = strValue.match(pattern.regex);
    if (match) {
      const url = pattern.urlFor(match);
      if (url) {
        const filename = url.split("/").pop();
        return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" title="' +
          escapeHtml(strValue) + '">' + escapeHtml(displayText) + "</a>" +
          ' <a href="#" onclick="downloadFile(\'' + escapeHtml(url) + '\', \'' + escapeHtml(filename) + '\'); return false;" ' +
          'title="Download this file - e.g. to open directly in Jmol">⬇</a>';
      }
    }
  }
  return '<span title="' + escapeHtml(strValue) + '">' + escapeHtml(displayText) + "</span>";
}

function showError(err) {
  const box = document.getElementById("error");
  box.style.display = "block";
  box.textContent = "Something went wrong:\n\n" + (err && err.message ? err.message : String(err)) +
    "\n\nIf you're seeing this, please copy this whole message (and check your " +
    "browser's own developer console for anything extra) and report it back.";
}

// Every example available right now: the ones generic across every
// dataset, plus whichever ones the currently-selected dataset itself
// adds (e.g. a real file name for provenance, a literature link only
// where one genuinely exists). Rebuilt fresh each time a dataset
// loads, so switching datasets always shows the right combined set.
function currentExamples() {
  const datasetOwn = DATASETS[currentDatasetId].datasetExamples || [];
  // The shared examples use this project's own gc:/ex: vocabulary,
  // which an unrelated, user-supplied graph has no reason to share -
  // an uploaded graph gets only its own two, genuinely generic ones.
  if (DATASETS[currentDatasetId].isUserUpload) return datasetOwn;
  return SHARED.examples.concat(datasetOwn);
}

function currentPrefixes() {
  return DATASETS[currentDatasetId].prefixesOverride || SHARED.prefixes;
}

function loadExample(index) {
  const ex = currentExamples()[index];
  document.getElementById("query-box").value = currentPrefixes().trim() + "\n\n" + ex.query;
  document.getElementById("example-desc").textContent = ex.description;
}

function buildExampleButtons() {
  const container = document.getElementById("example-buttons");
  let html = "";
  currentExamples().forEach(function (ex, i) {
    html += '<button class="example-btn" onclick="loadExample(' + i + ')">' + ex.label + '</button>';
  });
  html += '<p class="example-desc" id="example-desc"></p>';
  container.innerHTML = html;
}

// Reads ?dataset=<id> from the page's own URL, so a link can point
// directly at a specific dataset (e.g. "...sparql_playground.html?dataset=aa").
// Falls back to DEFAULT_DATASET_ID for anything missing or unrecognised,
// so the existing, already-shared link (no parameter at all) keeps
// behaving exactly as it always has.
function getDatasetIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("dataset");
  if (requested && DATASETS[requested]) {
    return requested;
  }
  return DEFAULT_DATASET_ID;
}

function populateDatasetSelector() {
  const select = document.getElementById("dataset-select");
  select.innerHTML = "";
  Object.keys(DATASETS).forEach(function (id) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = DATASETS[id].label;
    select.appendChild(option);
  });
  select.value = currentDatasetId;
}

// Called when the dropdown changes. Resets the whole query/results UI
// back to its just-loaded state before fetching the newly-selected
// graph - stale results from the previous dataset should never linger
// on screen once a different one is chosen.
function switchDataset(id) {
  if (!DATASETS[id]) return;
  currentDatasetId = id;

  const url = new URL(window.location.href);
  url.searchParams.set("dataset", id);
  history.replaceState(null, "", url);

  document.getElementById("query-area").style.display = "none";
  document.getElementById("results").innerHTML = "";
  document.getElementById("view-toggle").style.display = "none";
  document.getElementById("graph-container").style.display = "none";
  document.getElementById("label-style-toggle").style.display = "none";
  document.getElementById("error").style.display = "none";
  lastRows = [];
  lastVarNames = [];

  const fileRow = document.getElementById("own-graph-file-row");
  const fileInput = document.getElementById("own-graph-file");

  if (DATASETS[id].isUserUpload) {
    // No file has been picked yet on switching here - show the picker
    // and the dataset's own intro, then wait for loadUserFile() to be
    // triggered by the file input's own onchange, rather than fetch
    // anything automatically.
    fileRow.style.display = "block";
    fileInput.value = "";
    document.title = DATASETS[id].pageTitle;
    document.getElementById("page-heading").textContent = SHARED.heading;
    document.getElementById("page-intro").innerHTML = DATASETS[id].introHtml;
    document.getElementById("status").textContent = "Choose a Turtle file above to begin.";
    return;
  }

  fileRow.style.display = "none";
  loadDataset();
}

// Shared by both loading paths below: parses a Turtle string that's
// already been obtained (however it got here - fetched from GitHub,
// or read from a local file the person picked), then brings the rest
// of the UI up to date. Neither caller needs to know how the other
// one got its text.
function parseAndDisplayGraph(ttlText, baseUri) {
  const statusEl = document.getElementById("status");
  try {
    if (typeof $rdf === "undefined") {
      throw new Error("rdflib.js did not load from the CDN - check your internet connection, or the CDN link itself may need updating.");
    }

    store = $rdf.graph();
    $rdf.parse(ttlText, store, baseUri, "text/turtle");

    const tripleCount = store.statementsMatching(undefined, undefined, undefined).length;
    if (tripleCount === 0) {
      throw new Error("The graph loaded but contains zero triples - the Turtle parse likely silently failed. This is worth reporting.");
    }

    statusEl.textContent = "Graph loaded: " + tripleCount + " triples. Ready to query.";
    document.getElementById("query-area").style.display = "block";
    buildExampleButtons();
    if (currentExamples().length > 0) loadExample(0);

  } catch (err) {
    statusEl.textContent = "Failed to load the graph.";
    showError(err);
  }
}

async function loadDataset() {
  document.title = DATASETS[currentDatasetId].pageTitle;
  document.getElementById("page-heading").textContent = SHARED.heading;
  document.getElementById("page-intro").innerHTML = DATASETS[currentDatasetId].introHtml;

  const statusEl = document.getElementById("status");
  statusEl.textContent = "Loading graph...";
  try {
    const response = await fetch(DATASETS[currentDatasetId].graphUrl);
    if (!response.ok) {
      throw new Error("Could not fetch the graph (HTTP " + response.status + "). " +
        "The graph URL for this dataset may have changed, or the source may be temporarily unreachable.");
    }
    const ttlText = await response.text();
    parseAndDisplayGraph(ttlText, DATASETS[currentDatasetId].graphUrl);

  } catch (err) {
    statusEl.textContent = "Failed to load the graph.";
    showError(err);
  }
}

// The own-graph counterpart to loadDataset() above: reads a local
// file the person picked (nothing is uploaded anywhere - this all
// happens in their own browser), then hands its text to the exact
// same parseAndDisplayGraph() every built-in dataset already uses.
async function loadUserFile(file) {
  if (!file) return;

  document.title = DATASETS[currentDatasetId].pageTitle;
  document.getElementById("page-heading").textContent = SHARED.heading;
  document.getElementById("page-intro").innerHTML = DATASETS[currentDatasetId].introHtml;
  document.getElementById("error").style.display = "none";

  const statusEl = document.getElementById("status");
  statusEl.textContent = "Reading " + file.name + "...";
  try {
    const ttlText = await file.text();
    parseAndDisplayGraph(ttlText, "http://example.org/uploaded-graph/");
  } catch (err) {
    statusEl.textContent = "Failed to load the graph.";
    showError(err);
  }
}

function init() {
  currentDatasetId = getDatasetIdFromUrl();
  populateDatasetSelector();
  loadDataset();
}

function runQuery() {
  const runBtn = document.getElementById("run-btn");
  const resultsEl = document.getElementById("results");
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  resultsEl.innerHTML = "";
  runBtn.disabled = true;
  runBtn.textContent = "Running...";

  try {
    let queryText = document.getElementById("query-box").value;

    // rdflib.js's SPARQL support is basic and doesn't reliably handle
    // LIMIT/OFFSET - handled here instead: stripped before parsing,
    // then applied by hand to the results afterwards.
    let limitValue = null;
    let offsetValue = 0;
    queryText = queryText.replace(/\bLIMIT\s+(\d+)\b/i, function (m, n) {
      limitValue = parseInt(n, 10);
      return "";
    });
    queryText = queryText.replace(/\bOFFSET\s+(\d+)\b/i, function (m, n) {
      offsetValue = parseInt(n, 10);
      return "";
    });

    // rdflib.js's FILTER support is genuinely unreliable, confirmed
    // directly against its own open, unresolved GitHub issue (#535 -
    // "FILTER(contains(...)) does not filter anything") - IN() and
    // numeric comparisons were both confirmed broken on this project's
    // own real queries too. Handled the same way as LIMIT/OFFSET
    // above: stripped before parsing, applied by hand to the raw rows
    // afterwards. This only covers the two FILTER shapes this
    // project's own queries actually use (IN(...) membership, and a
    // single numeric comparison) - not arbitrary SPARQL FILTER syntax.
    const manualFilters = [];

    queryText = queryText.replace(/FILTER\s*\(\s*\?(\w+)\s+IN\s*\(([^)]+)\)\s*\)/gi,
      function (whole, varName, list) {
        const values = list.split(",").map(function (v) {
          return expandPrefixed(v.trim());
        });
        manualFilters.push(function (row) {
          return values.indexOf(row[varName]) !== -1;
        });
        return "";
      });

    queryText = queryText.replace(/FILTER\s*\(\s*\?(\w+)\s*(<=|>=|<|>|=)\s*(-?\d+\.?\d*)\s*\)/gi,
      function (whole, varName, op, numStr) {
        const num = parseFloat(numStr);
        manualFilters.push(function (row) {
          const val = parseFloat(row[varName]);
          if (isNaN(val)) return false;
          if (op === "<") return val < num;
          if (op === ">") return val > num;
          if (op === "<=") return val <= num;
          if (op === ">=") return val >= num;
          if (op === "=") return val === num;
          return false;
        });
        return "";
      });

    // FILTER(?var != value) against a URI or prefixed name - e.g.
    // excluding owl:NamedIndividual, which robot adds to every real
    // instance alongside its actual, specific class, so a plain
    // "?x a ?type" genuinely returns both and needs this to show only
    // the meaningful one. Strips a wrapping <...> if given a full URI
    // directly, then reuses expandPrefixed() the same way IN() does.
    queryText = queryText.replace(/FILTER\s*\(\s*\?(\w+)\s*!=\s*(\S+?)\s*\)/gi,
      function (whole, varName, rawValue) {
        const expanded = expandPrefixed(rawValue.replace(/^<|>$/g, ""));
        manualFilters.push(function (row) {
          return row[varName] !== expanded;
        });
        return "";
      });

    // SELECT DISTINCT ?var [?var2 ...] - rdflib.js parses the DISTINCT
    // keyword without error but genuinely ignores it (confirmed
    // directly: a query mixing rdf:type and other properties returned
    // every raw, un-deduplicated triple, not the distinct set of
    // requested variables). Handled the same way as everything above:
    // "DISTINCT" is stripped so rdflib.js treats it as a plain SELECT,
    // and the real projection + deduplication is done by hand below,
    // once the raw rows are in.
    let distinctVars = null;
    let distinctSortVar = null;
    queryText = queryText.replace(/SELECT\s+DISTINCT\s+((?:\?\w+\s*)+)WHERE/i,
      function (whole, varList) {
        distinctVars = varList.trim().split(/\s+/).map(function (v) { return v.slice(1); });
        return "SELECT " + varList + "WHERE";
      });
    // A plain "ORDER BY ?var" (ascending, no DESC) on one of the
    // DISTINCT variables - rdflib.js's own attempt at this runs on
    // the raw, un-deduplicated rows, before this workaround's own
    // dedup step discards whatever order it produced. Recognised only
    // for a variable already in distinctVars, and applied by hand,
    // alphabetically, once dedup has happened.
    if (distinctVars) {
      const orderByMatch = queryText.match(/ORDER BY\s+\?(\w+)\s*$/i);
      if (orderByMatch && distinctVars.indexOf(orderByMatch[1]) !== -1) {
        distinctSortVar = orderByMatch[1];
        queryText = queryText.replace(/ORDER BY\s+\?\w+\s*$/i, "");
      }
    }

    // SELECT ?var (COUNT(?other) AS ?alias) WHERE {...} GROUP BY ?var
    // [ORDER BY DESC(?alias)] - rdflib.js has no real GROUP BY/COUNT
    // support at all (confirmed directly: it silently returns one
    // ungrouped row per underlying triple, ignoring both the
    // aggregate and the grouping entirely). This covers the one
    // shape this playground's own examples actually need - a single
    // grouping variable, a single COUNT(...), and an optional
    // ORDER BY DESC on that same count - not general SPARQL
    // aggregation. The SELECT/GROUP BY/ORDER BY clauses are rewritten
    // into a plain, ungrouped projection before parsing; the real
    // grouping, counting, and sorting happen by hand below.
    let groupByInfo = null;
    const groupBySelectMatch = queryText.match(/SELECT\s+\?(\w+)\s+\(COUNT\(\?(\w+)\)\s+AS\s+\?(\w+)\)\s+WHERE/i);
    const groupByClauseMatch = queryText.match(/GROUP BY\s+\?(\w+)/i);
    if (groupBySelectMatch && groupByClauseMatch && groupBySelectMatch[1] === groupByClauseMatch[1]) {
      const orderByDescMatch = queryText.match(/ORDER BY DESC\(\?(\w+)\)/i);
      groupByInfo = {
        groupVar: groupBySelectMatch[1],
        countVar: groupBySelectMatch[2],
        aliasVar: groupBySelectMatch[3],
        orderByAlias: orderByDescMatch ? orderByDescMatch[1] : null
      };
      queryText = queryText.replace(/SELECT\s+\?(\w+)\s+\(COUNT\(\?(\w+)\)\s+AS\s+\?(\w+)\)\s+WHERE/i,
        "SELECT ?" + groupByInfo.groupVar + " ?" + groupByInfo.countVar + " WHERE");
      queryText = queryText.replace(/GROUP BY\s+\?\w+/i, "");
      queryText = queryText.replace(/ORDER BY DESC\(\?\w+\)/i, "");
    }

    const query = $rdf.SPARQLToQuery(queryText, false, store);

    if (!query) {
      throw new Error("The query could not be parsed. Check your SPARQL syntax - " +
        "note that rdflib.js's SPARQL support is basic, not the full SPARQL 1.1 " +
        "specification, so some valid SPARQL may not work here even if it's correct.");
    }

    const rows = [];
    // The union of every key seen across ALL rows, not just the
    // first - a real, confirmed bug found via real use: with OPTIONAL
    // blocks, different rows can bind different subsets of variables,
    // and building the column list from only the first row silently
    // hid genuinely-present data in later rows (e.g. a query mixing
    // full-thermochemistry and electronic-energy-only experiments,
    // where whichever experiment happened to come back first decided
    // which columns the WHOLE table would ever show).
    const varNameSet = new Set();

    store.query(
      query,
      function (result) {
        const row = {};
        for (const key in result) {
          const cleanKey = key.startsWith("?") ? key.slice(1) : key;
          varNameSet.add(cleanKey);
          const val = result[key];
          row[cleanKey] = val && val.value !== undefined ? val.value : String(val);
        }
        rows.push(row);
      },
      undefined,
      function () {
        runBtn.disabled = false;
        runBtn.textContent = "Run query";

        let varNames = Array.from(varNameSet);
        let workingRows = rows;

        // Apply GROUP BY + COUNT by hand first - it changes the shape
        // of the result entirely (many raw rows collapse into one
        // grouped row each), so DISTINCT and the manual FILTERs below
        // should see the grouped result, not the raw rows underneath.
        if (groupByInfo && workingRows.length > 0) {
          const groups = {};
          workingRows.forEach(function (row) {
            const key = row[groupByInfo.groupVar];
            if (!groups[key]) groups[key] = new Set();
            groups[key].add(row[groupByInfo.countVar]);
          });
          workingRows = Object.keys(groups).map(function (key) {
            const grouped = {};
            grouped[groupByInfo.groupVar] = key;
            grouped[groupByInfo.aliasVar] = groups[key].size;
            return grouped;
          });
          if (groupByInfo.orderByAlias === groupByInfo.aliasVar) {
            workingRows.sort(function (a, b) { return b[groupByInfo.aliasVar] - a[groupByInfo.aliasVar]; });
          }
          varNames = [groupByInfo.groupVar, groupByInfo.aliasVar];
        }

        // Apply SELECT DISTINCT by hand - project only the requested
        // variable(s), then drop rows whose projected values have
        // already been seen (in first-seen order, matching how a real
        // SPARQL engine's DISTINCT behaves absent an ORDER BY).
        if (distinctVars && workingRows.length > 0) {
          const seen = new Set();
          const dedupedRows = [];
          workingRows.forEach(function (row) {
            const key = distinctVars.map(function (v) { return row[v]; }).join("\u0000");
            if (!seen.has(key)) {
              seen.add(key);
              const projected = {};
              distinctVars.forEach(function (v) { projected[v] = row[v]; });
              dedupedRows.push(projected);
            }
          });
          if (distinctSortVar) {
            dedupedRows.sort(function (a, b) {
              return a[distinctSortVar] < b[distinctSortVar] ? -1 :
                     a[distinctSortVar] > b[distinctSortVar] ? 1 : 0;
            });
          }
          workingRows = dedupedRows;
          varNames = distinctVars.slice();
        }

        if (workingRows.length === 0) {
          resultsEl.innerHTML = "<p><em>No results.</em> This may be a real, correct " +
            "finding (the pattern genuinely doesn't match anything) rather than an error - " +
            "worth double-checking your query logic either way.</p>";
          document.getElementById("view-toggle").style.display = "none";
          document.getElementById("graph-container").style.display = "none";
          document.getElementById("label-style-toggle").style.display = "none";
          return;
        }

        // Apply the manual FILTER workarounds before anything else -
        // totalMatches and LIMIT/OFFSET should both reflect the
        // filtered set, not rdflib.js's raw, unfiltered result count.
        const filteredRows = manualFilters.length === 0 ? workingRows :
          workingRows.filter(function (row) {
            return manualFilters.every(function (f) { return f(row); });
          });

        const totalMatches = filteredRows.length;
        let displayRows = filteredRows.slice(offsetValue);
        if (limitValue !== null) {
          displayRows = displayRows.slice(0, limitValue);
        }

        lastRows = displayRows;
        lastVarNames = varNames;
        lastTotalMatches = totalMatches;
        lastWasLimited = (limitValue !== null || offsetValue > 0 || manualFilters.length > 0);

        renderTable();

        const toggleEl = document.getElementById("view-toggle");
        if (varNames.length >= 2) {
          toggleEl.style.display = "block";
        } else {
          toggleEl.style.display = "none";
        }
        showView("table");
      }
    );
  } catch (err) {
    runBtn.disabled = false;
    runBtn.textContent = "Run query";
    showError(err);
  }
}

function renderTable() {
  const resultsEl = document.getElementById("results");
  document.getElementById("label-style-toggle").style.display = lastRows.length > 0 ? "block" : "none";
  let html = "<table><tr>";
  lastVarNames.forEach(function (v) { html += "<th>" + v + "</th>"; });
  html += "</tr>";
  lastRows.forEach(function (row) {
    html += "<tr>";
    lastVarNames.forEach(function (v) {
      html += "<td>" + (row[v] !== undefined ? linkifyValue(row[v]) : "") + "</td>";
    });
    html += "</tr>";
  });
  html += "</table><p>" + lastRows.length + " result(s) shown" +
    (lastWasLimited ? " (LIMIT/OFFSET/FILTER applied by this tool itself, not by the underlying engine; " +
      lastTotalMatches + " total match" + (lastTotalMatches === 1 ? "" : "es") + " before that)" : "") +
    ".</p>";
  resultsEl.innerHTML = html;
}

function toggleLabelStyle() {
  useShortLabels = document.getElementById("short-labels-toggle").checked;
  if (lastVarNames.length > 0) {
    renderTable();
  }
}

function showView(which) {
  const resultsEl = document.getElementById("results");
  const graphEl = document.getElementById("graph-container");
  const tableBtn = document.getElementById("table-view-btn");
  const graphBtn = document.getElementById("graph-view-btn");

  if (which === "graph") {
    resultsEl.style.display = "none";
    graphEl.style.display = "block";
    tableBtn.style.fontWeight = "normal";
    graphBtn.style.fontWeight = "bold";
    try {
      renderGraph();
    } catch (err) {
      graphEl.innerHTML = "";
      showError(new Error("Could not draw the graph view: " + err.message +
        " (the table view above should still work fine)."));
    }
  } else {
    resultsEl.style.display = "block";
    graphEl.style.display = "none";
    tableBtn.style.fontWeight = "bold";
    graphBtn.style.fontWeight = "normal";
  }
}

// Above this many nodes, force-directed physics gets slow and the
// result is unreadable clutter anyway - capped rather than attempted,
// with a clear, honest message instead of a jammed browser.
const MAX_GRAPH_NODES = 75;

function renderGraph() {
  const graphEl = document.getElementById("graph-container");
  if (typeof vis === "undefined") {
    throw new Error("vis-network did not load from the CDN.");
  }

  graphEl.innerHTML = '<p style="padding:1em;">Building graph...</p>';

  const nodeIds = new Map();
  const nodes = [];
  const edges = [];
  let capped = false;

  function nodeIdFor(value) {
    if (!nodeIds.has(value)) {
      if (nodeIds.size >= MAX_GRAPH_NODES) {
        capped = true;
        return null;
      }
      nodeIds.set(value, nodeIds.size);
      nodes.push({ id: nodeIds.get(value), label: shortLabel(value), title: value });
    }
    return nodeIds.get(value);
  }

  for (const row of lastRows) {
    for (let i = 0; i < lastVarNames.length - 1; i++) {
      const fromVal = row[lastVarNames[i]];
      const toVal = row[lastVarNames[i + 1]];
      if (fromVal === undefined || toVal === undefined) continue;
      const fromId = nodeIdFor(String(fromVal));
      const toId = nodeIdFor(String(toVal));
      if (fromId === null || toId === null) { capped = true; continue; }
      edges.push({ from: fromId, to: toId, label: lastVarNames[i + 1] });
    }
    if (capped) break;
  }

  // Run a real timer so the "Building graph..." message actually has
  // a moment to appear on screen before the (potentially slow) layout
  // work begins, rather than both happening in the same render frame.
  setTimeout(function () {
    graphEl.innerHTML = "";

    if (capped) {
      const note = document.createElement("p");
      note.style.cssText = "color:#666; font-size:13px; padding:0 0 0.5em 0;";
      note.textContent = "Showing the first " + MAX_GRAPH_NODES + " nodes only - " +
        "this result set is too large to usefully draw in full. Add a LIMIT to " +
        "your query for a smaller, clearer picture (the table view above still " +
        "shows every result).";
      graphEl.appendChild(note);
    }

    const canvasDiv = document.createElement("div");
    canvasDiv.style.height = capped ? "460px" : "500px";
    graphEl.appendChild(canvasDiv);

    const data = {
      nodes: new vis.DataSet(nodes),
      edges: new vis.DataSet(edges)
    };
    const options = {
      nodes: { shape: "box", font: { size: 13 } },
      edges: { font: { size: 11, align: "middle" }, arrows: "to" },
      physics: {
        stabilization: { iterations: 150 }
      }
    };
    const network = new vis.Network(canvasDiv, data, options);

    // Freeze physics once the initial layout settles, so the browser
    // isn't left continuously recomputing forces forever - this,
    // more than anything else, is what was making the graph view feel
    // like it had jammed the browser.
    network.once("stabilizationIterationsDone", function () {
      network.setOptions({ physics: false });
    });
  }, 10);
}

init();
</script>
